modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "More Animation"
    credits = "${mod_credits}"
    authors = "${mod_authors}"
    description = '''给酒狐添加更多动作'''

[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "touhou_little_maid"
    type = "required"
    versionRange = "[1.5.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "mixins.moreanimation.json"
